          -o deutsch.m3u

          echo "Lade iranische Sender..."
          curl -fL \
          "https://iptv-org.github.io/iptv/countries/ir.m3u" \
          -o iran.m3u

          echo "Lade weltweit persischsprachige Sender..."
          curl -fL \
          "https://iptv-org.github.io/iptv/languages/fas.m3u" \

name: Update IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download playlists
        run: |
          curl -fL "https://iptv-org.github.io/iptv/countries/de.m3u" -o de.m3u
          curl -fL "https://iptv-org.github.io/iptv/countries/ir.m3u" -o ir.m3u
          curl -fL "https://iptv-org.github.io/iptv/languages/fas.m3u" -o fas.m3u

      - name: Create combined playlist
        run: |
          echo "#EXTM3U" > TV-Deutschland-Iran-Persisch.m3u
          tail -n +2 de.m3u >> TV-Deutschland-Iran-Persisch.m3u
          tail -n +2 ir.m3u >> TV-Deutschland-Iran-Persisch.m3u
          tail -n +2 fas.m3u >> TV-Deutschland-Iran-Persisch.m3u

      - name: Remove temporary files
        run: |
          rm -f de.m3u ir.m3u fas.m3u

      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TV-Deutschland-Iran-Persisch.m3u
          git diff --cached --quiet || git commit -m "Update IPTV Playlist"
          git push

name: Update IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPTV playlists
        run: |
          curl -fL "https://iptv-org.github.io/iptv/countries/de.m3u" -o deutsch.m3u
          curl -fL "https://iptv-org.github.io/iptv/countries/ir.m3u" -o iran.m3u
          curl -fL "https://iptv-org.github.io/iptv/languages/fas.m3u" -o persisch.m3u

      - name: Sortiere Sender
        shell: python
        run: |
          import re

          sources = [
              ("deutsch.m3u", "Deutsch"),
              ("iran.m3u", "Persisch"),
              ("persisch.m3u", "Persisch")
          ]

          output_file = "TV-Deutschland-Iran-Persisch.m3u"

          seen_urls = set()
          channels = []

          def kategorisieren(name, sprache):

              name = name.lower()

              news = [
                  "news", "nachrichten", "tagesschau",
                  "welt", "ntv", "phoenix",
                  "iran international", "iranintl",
                  "bbc persian", "voa", "manoto news"
              ]

              music = [
                  "music", "musik", "radio",
                  "hits", "hit", "deluxe music",
                  "persian music", "pmc",
                  "radio javan", "ava music"
              ]

              sport = [
                  "sport", "sports", "football",
                  "fussball", "fußball",
                  "bundesliga"
              ]

              kinder = [
                  "kika", "kinder", "kids",
                  "junior", "cartoon",
                  "toon", "baby"
              ]

              doku = [
                  "doku", "documentary",
                  "natur", "history",
                  "science", "wissen"
              ]

              filme = [
                  "movie", "movies", "film",
                  "filme", "cinema",
                  "kino", "series",
                  "serie", "serial"
              ]

              regional = [
                  "wdr", "ndr", "swr",
                  "br ", "mdr", "rbb",
                  "hr ", "sr ", "radio bremen"
              ]

              if any(x in name for x in news):
                  return f"{sprache} | News"

              if any(x in name for x in music):
                  return f"{sprache} | Musik"

              if any(x in name for x in sport):
                  return f"{sprache} | Sport"

              if any(x in name for x in kinder):
                  return f"{sprache} | Kinder"

              if any(x in name for x in filme):
                  return f"{sprache} | Filme & Serien"

              if sprache == "Deutsch":

                  if any(x in name for x in doku):
                      return "Deutsch | Doku"

                  if any(x in name for x in regional):
                      return "Deutsch | Regional"

              return f"{sprache} | Allgemein"


          for filename, sprache in sources:

              with open(
                  filename,
                  "r",
                  encoding="utf-8-sig",
                  errors="ignore"
              ) as f:

                  lines = f.readlines()

              i = 0

              while i < len(lines):

                  line = lines[i].strip()

                  if not line.startswith("#EXTINF:"):
                      i += 1
                      continue

                  metadata = line

                  # Sendername
                  if "," in metadata:
                      name = metadata.split(",", 1)[1].strip()
                  else:
                      name = "Unbekannt"

                  # URL suchen
                  url = ""
                  j = i + 1

                  while j < len(lines):

                      candidate = lines[j].strip()

                      if (
                          candidate
                          and not candidate.startswith("#")
                      ):
                          url = candidate
                          break

                      if candidate.startswith("#EXTINF:"):
                          break

                      j += 1

                  # Duplikate entfernen
                  if url and url not in seen_urls:

                      seen_urls.add(url)

                      group = kategorisieren(
                          name,
                          sprache
                      )

                      # Vorhandene Gruppe ersetzen

                      if 'group-title="' in metadata:

                          metadata = re.sub(
                              r'group-title="[^"]*"',
                              f'group-title="{group}"',
                              metadata
                          )

                      else:

                          comma = metadata.find(",")

                          metadata = (
                              metadata[:comma]
                              + f' group-title="{group}"'
                              + metadata[comma:]
                          )

                      channels.append({
                          "group": group,
                          "name": name,
                          "metadata": metadata,
                          "url": url
                      })

                  i = j + 1


          category_order = {

              "Deutsch | News": 1,
              "Deutsch | Filme & Serien": 2,
              "Deutsch | Musik": 3,
              "Deutsch | Sport": 4,
              "Deutsch | Kinder": 5,
              "Deutsch | Doku": 6,
              "Deutsch | Regional": 7,
              "Deutsch | Allgemein": 8,

              "Persisch | News": 20,
              "Persisch | Filme & Serien": 21,
              "Persisch | Musik": 22,
              "Persisch | Sport": 23,
              "Persisch | Kinder": 24,
              "Persisch | Allgemein": 25
          }


          channels.sort(
              key=lambda x: (
                  category_order.get(
                      x["group"],
                      99
                  ),
                  x["name"].casefold()
              )
          )


          with open(
              output_file,
              "w",
              encoding="utf-8"
          ) as f:

              f.write("#EXTM3U\n")

              for channel in channels:

                  f.write(
                      channel["metadata"] + "\n"
                  )

                  f.write(
                      channel["url"] + "\n"
                  )


          print("")
          print("============================")
          print("IPTV PLAYLIST")
          print("============================")

          for group in category_order:

              count = sum(
                  1 for x in channels
                  if x["group"] == group
              )

              print(
                  f"{group}: {count}"
              )

          print("----------------------------")
          print(
              f"GESAMT: {len(channels)} Sender"
          )


      - name: Remove temporary files
        run: |
          rm -f deutsch.m3u iran.m3u persisch.m3u


      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add TV-Deutschland-Iran-Persisch.m3u

          if git diff --cached --quiet; then
            echo "Keine Aenderungen"
          else
            git commit -m "Update sortierte IPTV Playlist"
            git push
          fi

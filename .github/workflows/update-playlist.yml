name: Update IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download required playlists
        run: |
          curl --retry 3 --connect-timeout 20 -fL \
            "https://iptv-org.github.io/iptv/countries/de.m3u" \
            -o deutsch.m3u

          curl --retry 3 --connect-timeout 20 -fL \
            "https://iptv-org.github.io/iptv/countries/ir.m3u" \
            -o iran.m3u

          curl --retry 3 --connect-timeout 20 -fL \
            "https://iptv-org.github.io/iptv/languages/fas.m3u" \
            -o persisch.m3u

          curl --retry 3 --connect-timeout 20 -fL \
            "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/ir_telewebion.m3u" \
            -o telewebion.m3u

          curl --retry 3 --connect-timeout 20 -fL \
            "https://raw.githubusercontent.com/shayanline/iptv-iran/main/playlists/categories/sat-movies.m3u" \
            -o persian-movies.m3u

      - name: Download optional German FAST playlists
        run: |
          download_optional() {
            url="$1"
            file="$2"

            if curl --retry 2 --connect-timeout 20 -fL "$url" -o "$file"; then
              echo "Erfolgreich geladen: $file"
            else
              echo "#EXTM3U" > "$file"
              echo "Quelle nicht erreichbar, leere Ersatzdatei erstellt: $file"
            fi
          }

          download_optional \
            "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/de_pluto.m3u" \
            "de-pluto.m3u"

          download_optional \
            "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/de_rakuten.m3u" \
            "de-rakuten.m3u"

          download_optional \
            "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/de_samsung.m3u" \
            "de-samsung.m3u"

      - name: Build categorized playlist
        shell: python
        run: |
          import re
          from pathlib import Path

          OUTPUT = "TV-Deutschland-Iran-Persisch.m3u"

          sources = [
              ("deutsch.m3u", "Deutsch"),
              ("de-pluto.m3u", "DeutschFAST"),
              ("de-rakuten.m3u", "DeutschFAST"),
              ("de-samsung.m3u", "DeutschFAST"),
              ("persian-movies.m3u", "PersischMovies"),
              ("iran.m3u", "Persisch"),
              ("persisch.m3u", "Persisch"),
              ("telewebion.m3u", "Telewebion")
          ]

          seen_urls = set()
          seen_ids = set()
          channels = []

          def contains(text, words):
              return any(word in text for word in words)

          def get_attribute(metadata, attribute):
              match = re.search(
                  rf'{re.escape(attribute)}="([^"]*)"',
                  metadata,
                  flags=re.IGNORECASE
              )
              return match.group(1).strip() if match else ""

          def set_group(metadata, group):
              if re.search(r'group-title="[^"]*"', metadata):
                  return re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{group}"',
                      metadata
                  )

              comma = metadata.find(",")

              if comma == -1:
                  return metadata

              return (
                  metadata[:comma]
                  + f' group-title="{group}"'
                  + metadata[comma:]
              )

          def normal_category(name, language):
              n = name.casefold()

              if contains(n, [
                  "news", "nachrichten", "tagesschau", "welt",
                  "ntv", "phoenix", "iran international",
                  "iranintl", "bbc persian", "voa", "khabar",
                  "خبر"
              ]):
                  return f"{language} | News"

              if contains(n, [
                  "music", "musik", "radio", "hits", "deluxe",
                  "pmc", "radio javan", "ava music"
              ]):
                  return f"{language} | Musik"

              if contains(n, [
                  "sport", "sports", "football", "fussball",
                  "fußball", "bundesliga", "varzesh", "ورزش"
              ]):
                  return f"{language} | Sport"

              if contains(n, [
                  "kika", "kinder", "kids", "junior", "cartoon",
                  "baby", "pooya", "pouya", "koodak",
                  "پویا", "کودک"
              ]):
                  return f"{language} | Kinder"

              if contains(n, [
                  "movie", "movies", "film", "filme", "cinema",
                  "kino", "series", "serie", "serial", "ifilm",
                  "namayesh", "tamasha", "نمایش", "تماشا"
              ]):
                  return f"{language} | Filme & Serien"

              if language == "Deutsch":
                  if contains(n, [
                      "doku", "documentary", "history",
                      "science", "wissen", "natur"
                  ]):
                      return "Deutsch | Doku"

                  if contains(n, [
                      "wdr", "ndr", "swr", "mdr", "rbb",
                      "radio bremen", "br ", "hr ", "sr "
                  ]):
                      return "Deutsch | Regional"

              return f"{language} | Allgemein"

          def fast_category(name, old_group):
              text = f"{name} {old_group}".casefold()

              if contains(text, [
                  "kinder", "kids", "junior", "nick", "nickelodeon",
                  "cartoon", "animation", "anime", "family", "familie",
                  "sponge", "baby", "toggo"
              ]):
                  return "Deutsch FAST | Kinder"

              if contains(text, [
                  "krimi", "crime", "true crime", "thriller",
                  "mystery", "polizei", "kommissar", "detective",
                  "detektiv", "horror", "paranormal"
              ]):
                  return "Deutsch FAST | Krimi & Thriller"

              if contains(text, [
                  "comedy", "komödie", "komoedie", "humor",
                  "fun", "lachen", "sitcom", "comedian"
              ]):
                  return "Deutsch FAST | Comedy"

              if contains(text, [
                  "action", "western", "adventure", "abenteuer",
                  "martial arts", "heroes", "hero"
              ]):
                  return "Deutsch FAST | Action"

              if contains(text, [
                  "serie", "series", "serien", "telenovela",
                  "soap", "drama", "sitcom", "episoden",
                  "tv shows", "show"
              ]):
                  return "Deutsch FAST | Serien"

              if contains(text, [
                  "movie", "movies", "film", "filme", "cinema",
                  "kino", "kultfilm", "filmgold", "netzkino",
                  "wedotv movies", "moviedome", "rakuten tv"
              ]):
                  return "Deutsch FAST | Filme"

              if contains(text, [
                  "doku", "documentary", "documentaries",
                  "history", "science", "wissen", "natur",
                  "animals", "wildlife", "travel", "reise",
                  "biografie", "biography"
              ]):
                  return "Deutsch FAST | Doku"

              return "Deutsch FAST | Allgemein"

          def telewebion_category(name):
              n = name.casefold()

              if contains(n, [
                  "irinn", "news", "khabar", "خبر"
              ]):
                  return "Telewebion | News"

              if contains(n, [
                  "varzesh", "sport", "sports", "ورزش"
              ]):
                  return "Telewebion | Sport"

              if contains(n, [
                  "ifilm", "namayesh", "movie", "movies",
                  "film", "cinema", "tamasha", "نمایش", "تماشا"
              ]):
                  return "Telewebion | Filme & Serien"

              if contains(n, [
                  "pooya", "pouya", "koodak", "kids",
                  "child", "children", "پویا", "کودک"
              ]):
                  return "Telewebion | Kinder"

              if contains(n, [
                  "abadan", "aflak", "aftab", "alborz", "atrak",
                  "azerbaijan", "baran", "boushehr", "bushehr",
                  "dena", "eshragh", "fars", "hamedan", "hamoon",
                  "ilam", "isfahan", "jahanbin", "kerman",
                  "khalij", "khorasan", "khuzestan", "kordestan",
                  "kurdistan", "lorestan", "mahabad", "qazvin",
                  "semnan", "sahand", "sabalan", "tabarestan",
                  "yazd", "zagros", "kish", "golestan"
              ]):
                  return "Telewebion | Regional"

              return "Telewebion | Allgemein"

          for filename, source_type in sources:
              path = Path(filename)

              if not path.exists():
                  print(f"Übersprungen, Datei fehlt: {filename}")
                  continue

              lines = path.read_text(
                  encoding="utf-8-sig",
                  errors="ignore"
              ).splitlines()

              i = 0

              while i < len(lines):
                  metadata = lines[i].strip()

                  if not metadata.startswith("#EXTINF:"):
                      i += 1
                      continue

                  name = (
                      metadata.split(",", 1)[1].strip()
                      if "," in metadata
                      else "Unbekannt"
                  )

                  old_group = get_attribute(metadata, "group-title")
                  tvg_id = get_attribute(metadata, "tvg-id").casefold()

                  url = ""
                  j = i + 1

                  while j < len(lines):
                      candidate = lines[j].strip()

                      if candidate.startswith("#EXTINF:"):
                          break

                      if candidate and not candidate.startswith("#"):
                          url = candidate
                          break

                      j += 1

                  if not url:
                      i = max(j, i + 1)
                      continue

                  normalized_url = url.strip()

                  if normalized_url in seen_urls:
                      i = j + 1
                      continue

                  if tvg_id and tvg_id in seen_ids:
                      i = j + 1
                      continue

                  if source_type == "Deutsch":
                      group = normal_category(name, "Deutsch")
                  elif source_type == "DeutschFAST":
                      group = fast_category(name, old_group)
                  elif source_type == "PersischMovies":
                      group = "Persisch | Filme & Serien"
                  elif source_type == "Persisch":
                      group = normal_category(name, "Persisch")
                  elif source_type == "Telewebion":
                      group = telewebion_category(name)
                  else:
                      group = "Sonstige"

                  metadata = set_group(metadata, group)

                  seen_urls.add(normalized_url)

                  if tvg_id:
                      seen_ids.add(tvg_id)

                  channels.append({
                      "group": group,
                      "name": name,
                      "metadata": metadata,
                      "url": normalized_url
                  })

                  i = j + 1

          order = {
              "Deutsch | News": 10,
              "Deutsch | Filme & Serien": 11,
              "Deutsch | Musik": 12,
              "Deutsch | Sport": 13,
              "Deutsch | Kinder": 14,
              "Deutsch | Doku": 15,
              "Deutsch | Regional": 16,
              "Deutsch | Allgemein": 17,

              "Deutsch FAST | Filme": 20,
              "Deutsch FAST | Serien": 21,
              "Deutsch FAST | Action": 22,
              "Deutsch FAST | Krimi & Thriller": 23,
              "Deutsch FAST | Comedy": 24,
              "Deutsch FAST | Kinder": 25,
              "Deutsch FAST | Doku": 26,
              "Deutsch FAST | Allgemein": 27,

              "Persisch | News": 30,
              "Persisch | Filme & Serien": 31,
              "Persisch | Musik": 32,
              "Persisch | Sport": 33,
              "Persisch | Kinder": 34,
              "Persisch | Allgemein": 35,

              "Telewebion | News": 40,
              "Telewebion | Sport": 41,
              "Telewebion | Filme & Serien": 42,
              "Telewebion | Kinder": 43,
              "Telewebion | Regional": 44,
              "Telewebion | Allgemein": 45
          }

          channels.sort(
              key=lambda channel: (
                  order.get(channel["group"], 99),
                  channel["name"].casefold()
              )
          )

          with open(OUTPUT, "w", encoding="utf-8", newline="\n") as f:
              f.write("#EXTM3U\n")

              for channel in channels:
                  f.write(channel["metadata"] + "\n")
                  f.write(channel["url"] + "\n")

          print("========================================")
          print("IPTV-PLAYLIST ERSTELLT")
          print("========================================")

          for group in order:
              count = sum(
                  channel["group"] == group
                  for channel in channels
              )

              if count:
                  print(f"{group}: {count}")

          print("----------------------------------------")
          print(f"Gesamt: {len(channels)} Sender")

          if not channels:
              raise RuntimeError(
                  "Die fertige Playlist enthält keine Sender."
              )

      - name: Validate generated playlist
        run: |
          test -s TV-Deutschland-Iran-Persisch.m3u
          head -n 1 TV-Deutschland-Iran-Persisch.m3u | grep -q "^#EXTM3U"
          test "$(grep -c '^#EXTINF:' TV-Deutschland-Iran-Persisch.m3u)" -gt 0

          echo "Playlist ist gültig."
          echo "Anzahl Sender:"
          grep -c "^#EXTINF:" TV-Deutschland-Iran-Persisch.m3u

      - name: Remove temporary files
        run: |
          rm -f deutsch.m3u iran.m3u persisch.m3u
          rm -f telewebion.m3u persian-movies.m3u
          rm -f de-pluto.m3u de-rakuten.m3u de-samsung.m3u

      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add TV-Deutschland-Iran-Persisch.m3u

          if git diff --cached --quiet; then
            echo "Keine Änderungen an der Playlist."
          else
            git commit -m "Update IPTV playlist with German FAST channels"
            git push
          fi

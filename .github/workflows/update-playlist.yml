name: Update IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPTV playlists
        run: |
          curl -fL "https://iptv-org.github.io/iptv/countries/de.m3u" -o deutsch.m3u
          curl -fL "https://iptv-org.github.io/iptv/countries/ir.m3u" -o iran.m3u
          curl -fL "https://iptv-org.github.io/iptv/languages/fas.m3u" -o persisch.m3u
          curl -fL "https://raw.githubusercontent.com/iptv-org/iptv/refs/heads/master/streams/ir_telewebion.m3u" -o telewebion.m3u

      - name: Create categorized playlist
        shell: python
        run: |
          import re

          sources = [
              ("deutsch.m3u", "Deutsch"),
              ("iran.m3u", "Persisch"),
              ("persisch.m3u", "Persisch"),
              ("telewebion.m3u", "Telewebion")
          ]

          OUTPUT = "TV-Deutschland-Iran-Persisch.m3u"

          seen_urls = set()
          channels = []

          def contains(name, words):
              return any(word in name for word in words)

          def normal_category(name, language):
              n = name.lower()

              if contains(n, [
                  "news", "nachrichten", "tagesschau",
                  "welt", "ntv", "phoenix",
                  "iran international", "bbc persian",
                  "voa"
              ]):
                  return f"{language} | News"

              if contains(n, [
                  "music", "musik", "radio",
                  "deluxe", "pmc", "radio javan"
              ]):
                  return f"{language} | Musik"

              if contains(n, [
                  "sport", "sports", "football",
                  "fussball", "fußball"
              ]):
                  return f"{language} | Sport"

              if contains(n, [
                  "kika", "kinder", "kids",
                  "junior", "cartoon", "baby"
              ]):
                  return f"{language} | Kinder"

              if contains(n, [
                  "movie", "movies", "film",
                  "cinema", "kino",
                  "series", "serie", "serial"
              ]):
                  return f"{language} | Filme & Serien"

              if language == "Deutsch":

                  if contains(n, [
                      "doku", "documentary",
                      "history", "science"
                  ]):
                      return "Deutsch | Doku"

                  if contains(n, [
                      "wdr", "ndr", "swr", "mdr",
                      "rbb", "radio bremen"
                  ]):
                      return "Deutsch | Regional"

              return f"{language} | Allgemein"


          def telewebion_category(name):
              n = name.lower()

              # NACHRICHTEN
              if contains(n, [
                  "irinn",
                  "news",
                  "khabar",
                  "خبر"
              ]):
                  return "Telewebion | News"

              # SPORT
              if contains(n, [
                  "varzesh",
                  "sport",
                  "sports",
                  "ورزش"
              ]):
                  return "Telewebion | Sport"

              # FILME UND SERIEN
              if contains(n, [
                  "ifilm",
                  "namayesh",
                  "movie",
                  "film",
                  "cinema",
                  "tamasha",
                  "نمایش",
                  "تماشا"
              ]):
                  return "Telewebion | Filme & Serien"

              # KINDER
              if contains(n, [
                  "pooya",
                  "pouya",
                  "koodak",
                  "kids",
                  " کودک",
                  "پویا"
              ]):
                  return "Telewebion | Kinder"

              # REGIONAL
              if contains(n, [
                  "abadan",
                  "aflak",
                  "aftab",
                  "alborz",
                  "atrak",
                  "azerbaijan",
                  "baran",
                  "boushehr",
                  "bushehr",
                  "dena",
                  "eshragh",
                  "fars",
                  "hamedan",
                  "hamoon",
                  "ilam",
                  "isfahan",
                  "jahanbin",
                  "kerman",
                  "khalij",
                  "khorasan",
                  "khuzestan",
                  "kordestan",
                  "kurdistan",
                  "lorestan",
                  "mahabad",
                  "qazvin",
                  "semnan",
                  "sahand",
                  "sabalan",
                  "tabarestan",
                  "yazd",
                  "zagros",
                  "kish",
                  "golestan"
              ]):
                  return "Telewebion | Regional"

              return "Telewebion | Allgemein"


          for filename, source_type in sources:

              with open(
                  filename,
                  "r",
                  encoding="utf-8-sig",
                  errors="ignore"
              ) as f:
                  lines = f.readlines()

              i = 0

              while i < len(lines):

                  line = lines[i].strip()

                  if not line.startswith("#EXTINF:"):
                      i += 1
                      continue

                  metadata = line

                  if "," in metadata:
                      name = metadata.split(",", 1)[1].strip()
                  else:
                      name = "Unbekannt"

                  url = ""
                  j = i + 1

                  while j < len(lines):

                      candidate = lines[j].strip()

                      if candidate and not candidate.startswith("#"):
                          url = candidate
                          break

                      if candidate.startswith("#EXTINF:"):
                          break

                      j += 1

                  if url and url not in seen_urls:

                      seen_urls.add(url)

                      if source_type == "Telewebion":
                          group = telewebion_category(name)
                      else:
                          group = normal_category(name, source_type)

                      if 'group-title="' in metadata:

                          metadata = re.sub(
                              r'group-title="[^"]*"',
                              f'group-title="{group}"',
                              metadata
                          )

                      else:

                          comma = metadata.find(",")

                          if comma != -1:
                              metadata = (
                                  metadata[:comma]
                                  + f' group-title="{group}"'
                                  + metadata[comma:]
                              )

                      channels.append({
                          "group": group,
                          "name": name,
                          "metadata": metadata,
                          "url": url
                      })

                  i = j + 1


          category_order = {

              "Deutsch | News": 10,
              "Deutsch | Filme & Serien": 11,
              "Deutsch | Musik": 12,
              "Deutsch | Sport": 13,
              "Deutsch | Kinder": 14,
              "Deutsch | Doku": 15,
              "Deutsch | Regional": 16,
              "Deutsch | Allgemein": 17,

              "Persisch | News": 20,
              "Persisch | Filme & Serien": 21,
              "Persisch | Musik": 22,
              "Persisch | Sport": 23,
              "Persisch | Kinder": 24,
              "Persisch | Allgemein": 25,

              "Telewebion | News": 30,
              "Telewebion | Sport": 31,
              "Telewebion | Filme & Serien": 32,
              "Telewebion | Kinder": 33,
              "Telewebion | Regional": 34,
              "Telewebion | Allgemein": 35
          }


          channels.sort(
              key=lambda x: (
                  category_order.get(x["group"], 99),
                  x["name"].casefold()
              )
          )


          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              f.write("#EXTM3U\n")

              for channel in channels:
                  f.write(channel["metadata"] + "\n")
                  f.write(channel["url"] + "\n")


          print("")
          print("====================================")
          print("      IPTV PLAYLIST STATISTIK")
          print("====================================")

          for group in category_order:

              count = sum(
                  1 for channel in channels
                  if channel["group"] == group
              )

              print(f"{group}: {count}")

          print("------------------------------------")
          print(f"GESAMT: {len(channels)} Sender")


      - name: Remove temporary files
        run: |
          rm -f deutsch.m3u iran.m3u persisch.m3u telewebion.m3u


      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add TV-Deutschland-Iran-Persisch.m3u

          if git diff --cached --quiet; then
            echo "Keine Aenderungen"
          else
            git commit -m "Update IPTV playlist with Telewebion categories"
            git push
          fi

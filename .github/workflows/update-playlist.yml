name: Update IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write
*jobs:
  update:
    runs-on: ubunt*-latest

    steps:
      - name: *epository laden
        uses: acti*ns/checkout@v4

      - name: IPTV*Listen herunterladen
        run: *
          curl -L "https://iptv-org.github.io/iptv/countries/de.m3u"*-o de.m3u
          curl -L "https://iptv-org.github.io/iptv/countries/ir.m3u" -o ir.m3u
          curl *L "https://iptv-org.github.io/iptv/languages/fas.m3u" -o fas.m3u

   *  - name: Playlists zusammenfuehre*
        run: |
          echo "#E*TM3U" > TV-Deutschland-Iran-Persis*h.m3u

          tail -n +2 de.m3u*>> TV-Deutschland-Iran-Persisch.m3*
          tail -n +2 ir.m3u >> TV*Deutschland-Iran-Persisch.m3u
    *     tail -n +2 fas.m3u >> TV-Deut*chland-Iran-Persisch.m3u

      - *ame: Temporaere Dateien entfernen
*       run: |
          rm -f de.m*u ir.m3u fas.m3u

      - name: Pl*ylist speichern
        run: |
   *      git config user.name "github*actions"
          git config user*email "github-actions@github.com"
*          git add TV-Deutschland-I*an-Persisch.m3u

          if git *iff --cached --quiet; then
       *    echo "Keine Aenderungen"
     *    else
            git commit -m*"IPTV Playlist automatisch aktuali*iert"
            git push
       *  fi
